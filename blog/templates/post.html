<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="{{description}}" />
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="kitallis.in" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:title" content="{{title}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:url" content="https://kitallis.in/p/{{slug}}/" />
  <meta property="og:image" content="{{image}}" />
  <meta name="twitter:card" content="{{twitter-card}}" />
  <meta name="twitter:title" content="{{title}}" />
  <meta name="twitter:description" content="{{description}}" />
  <meta name="twitter:image" content="{{image}}" />
  <title>{{title}} — kitallis.in</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="alternate" type="application/rss+xml" title="blog — kitallis.in" href="/rss.xml" />
  <link rel="stylesheet" href="/assets/prism.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    @view-transition { navigation: auto; }
    @media (prefers-reduced-motion: reduce) {
      ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) {
        animation: none !important;
      }
    }
    body {
      font-family: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 300;
      font-size: 20px;
      background: oklch(20% 0.0195 232.58);
      color: hsl(210, 12%, 85%, 0.85);
      min-height: 100vh;
      padding: 3rem 2rem;
      line-height: 1.6;
      text-wrap: pretty;
      font-optical-sizing: auto;
      text-rendering: optimizeLegibility;
    }
    h1, h2, h3, h4 {
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: -0.015em;
      text-wrap: balance;
    }
    main { max-width: 700px; margin: 0 auto; }
    a { color: #c9c9c9; text-decoration: none; border-bottom: 1px solid #444; }
    a:hover { color: #fff; border-color: #888; }
    nav { margin-bottom: 2rem; }
    .draft-tag { color: #b58900; font-size: 0.85em; }
    .unlisted-tag { color: #6c71c4; font-size: 0.85em; }
    article h1 { font-size: 1.75em; line-height: 1.15; margin-bottom: 0.25rem; }
    article time { color: #888; display: block; margin-bottom: 2rem; }
    .content h2 { font-size: 1.3em; margin: 2.25rem 0 0.5rem; }
    .content h3 { font-size: 1.1em; margin: 1.75rem 0 0.5rem; }
    .content h4 { font-size: 1em; margin: 1.5rem 0 0.5rem; }
    .content p { margin-bottom: 1rem; }
    .content ul, .content ol { margin: 0 0 1rem 1.5rem; }
    .content li { margin-bottom: 0.25rem; }
    .content blockquote {
      border-left: 2px solid #444;
      padding-left: 1rem;
      color: #999;
      line-height: 1.5;
      margin-bottom: 1rem;
    }
    .content pre {
      background: #1a1a1a;
      padding: 1rem;
      border-radius: 4px;
      overflow-x: auto;
      line-height: 1.45;
      margin-bottom: 1rem;
    }
    .content code {
      background: #1a1a1a;
      padding: 0.15rem 0.3rem;
      border-radius: 2px;
      font-size: 0.9em;
    }
    .content pre code { background: none; padding: 0; }
    .content img { max-width: 100%; border-radius: 4px; margin: 1rem 0; }
    .content .inline-svg { display: block; max-width: 100%; height: auto; margin: 1rem 0; }
    .content .inline-svg.mono path, .content .inline-svg.mono text { fill: currentColor; }
    .content .inline-svg.mono [stroke]:not([stroke="none"]) { stroke: currentColor; }
    .content hr { border: none; border-top: 1px solid #333; margin: 2rem 0; }
    .content h2, .content h3 { position: relative; scroll-margin-top: 1rem; }
    .content h2 .anchor, .content h3 .anchor {
      position: absolute; left: -1rem; width: 1rem;
      border: none; color: #555; opacity: 0;
    }
    .content h2:hover .anchor, .content h3:hover .anchor,
    .content .anchor:focus { opacity: 1; }
    .content sup a { border: none; }
    .content .footnotes {
      margin-top: 3rem; padding-top: 1rem;
      border-top: 1px solid #333;
      font-size: 0.85em; color: #999;
      line-height: 1.5;
    }
    .content .footnotes li { margin-bottom: 0.5rem; }
    .content .footnotes li:target { color: #fff; }
    .content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0 1.5rem;
      font-size: 0.9em;
      line-height: 1.4;
      border: 1px solid #333;
      border-radius: 4px;
    }
    .content th, .content td {
      text-align: left;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #2a2a2a;
      border-right: 1px solid #2a2a2a;
      vertical-align: top;
    }
    .content th:last-child, .content td:last-child { border-right: none; }
    .content th {
      font-weight: 500;
      color: #fff;
      border-bottom-color: #444;
    }
    .content tbody tr:last-child td { border-bottom: none; }
    hr { border: none; border-top: 1px solid #333; margin: 2rem 0; }
    .section-break { display: flex; align-items: center; gap: 1rem; margin: 2rem 0; color: #555; font-size: 0.85em; }
    .section-break::before, .section-break::after { content: ''; flex: 1; border-top: 1px solid #333; }
    footer { font-size: 0.75em; color: #888; }
    footer a { color: #888; }
    .subscribe { margin-left: auto; }
    footer a:hover { color: #fff; }
    .links { display: flex; gap: 1.5rem; flex-wrap: wrap; }
  </style>
  <link
    rel="preload"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..600&display=swap"
    as="style"
    onload="this.onload=null;this.rel='stylesheet'"
  />
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..600&display=swap"
      rel="stylesheet"
    />
  </noscript>
</head>
<body>
  <main>
    <nav>
      <a href="/" aria-label="Home">
        <img src="/blog/images/icon-home.svg" alt="" />
      </a>
    </nav>
    <article>
      <h1>{{title}}{{draft-tag}}</h1>
      <time>{{date}}</time>
      <div class="content">
        {{content}}
      </div>
    </article>
    <hr />
    <footer>
      <nav class="links">
        <a href="mailto:mail@kitallis.in">mail</a>
        <a href="https://github.com/kitallis">github</a>
        <a href="https://bsky.app/profile/repartee.party">bluesky</a>
        <span class="subscribe">
          <img src="/blog/images/icon-bell.svg" alt="subscribe bell icon" />
          <a href="/rss.xml">rss</a> / <a href="/subscribe/">email</a>
        </span>
      </nav>
    </footer>
  </main>
  <script src="/assets/prism.min.js" data-manual></script>
  <script>
    document.querySelectorAll('code[class]').forEach(function(el) {
      if (!el.className.startsWith('language-')) el.className = 'language-' + el.className;
    });
    Prism.highlightAll();
  </script>
  <script data-goatcounter="https://stats.kitallis.in/count"
          async src="//stats.kitallis.in/count.js"></script>
</body>
</html>
